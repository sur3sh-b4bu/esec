<div class="framework-grid-container" style="height: 100%; width: 100%;">
  <ag-grid-angular
    [rowData]="rowData()"
    [columnDefs]="context().columns"
    [defaultColDef]="defaultColDef"
    [theme]="context().theme || theme"
    [sideBar]="sideBar()"
    [gridOptions]="context().gridOptions"
    [quickFilterText]="context().filterService?.searchTerm()"
    (gridReady)="onGridReady($event)"
    (modelUpdated)="onModelUpdated()"
    (cellClicked)="onCellClicked($event)"
    style="height: 100%; width: 100%;">
  </ag-grid-angular>
</div>
