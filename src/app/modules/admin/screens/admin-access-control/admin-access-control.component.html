<div class="main">
    @for(manifest of moduleService.getModules(); track $index){
    @for(module of manifest.module; track module.id) {
    <div>
        <p> {{module.name}} </p>
    </div>
    @for(modules of module.list; track modules.id){
    <div>
        <p> {{modules.title}} </p>
    </div>
    }
    }
    }
</div>
