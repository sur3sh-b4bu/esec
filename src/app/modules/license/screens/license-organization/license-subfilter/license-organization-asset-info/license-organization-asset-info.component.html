<div class="asset-info-container">
  <div class="usage-info-bar">
    <div class="left-controls">
      <input type="text" class="filter-input" placeholder="Filter..." />

      <div class="radio-pill-group">
        <label class="radio-pill">
          <input type="radio" name="assetHrs" [checked]="hoursMode() === '24'" (change)="setHoursMode('24')" /> 24 Hours
        </label>
        <label class="radio-pill">
          <input type="radio" name="assetHrs" [checked]="hoursMode() === 'working'" (change)="setHoursMode('working')" /> Working Hours Usage 09:00 - 18:45
        </label>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" [checked]="workingDays()" (change)="toggleWorkingDays()" /> Working Days
      </label>
    </div>

    <div class="meta-info-text">
      Asset Info. Matlab. 27005&#64;MSILENGSAOLIC02. MATLAB_Report_Gen. 01-Feb-2021 To 09-Aug-2026 Rows : 167
    </div>
  </div>

  <div class="grid-wrapper">
    <framework-grid [context]="context"></framework-grid>
  </div>
</div>
