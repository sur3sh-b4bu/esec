<div class="checkout-user-container">
  <div class="usage-info-bar">
    <div class="left-controls">
      <input type="text" class="filter-input" placeholder="Filter..." />

      <div class="radio-pill-group">
        <label class="radio-pill">
          <input type="radio" name="chkMode" [checked]="viewMode() === 'date'" (change)="setViewMode('date')" /> Date
        </label>
        <label class="radio-pill">
          <input type="radio" name="chkMode" [checked]="viewMode() === 'time'" (change)="setViewMode('time')" /> Time
        </label>
      </div>
    </div>

    <div class="meta-info-text">
      Checkout User. Date. Matlab. 27005&#64;MSILENGSAOLIC02. MATLAB_Report_Gen. 15-Aug-2025 To 09-Aug-2026 Rows : 28
    </div>
  </div>

  <div class="grid-wrapper">
    <framework-grid [context]="context"></framework-grid>
  </div>
</div>
