@if(this.sideBarService.panelstatus()){
@for(manifest of moduleService.getModules(); track $index){
@for(module of manifest.module; track module.id) {
@if(module.name === getname()) {
<div class="panel-container">
    <div class="reports-panel">
        <div class="panel-header">
            <h3 class="panel-title">
                <p>{{module.name}}</p>
            </h3>
        </div>
        <div class="panel-content">
            <div class="search-box-container">
                <input type="text" class="report-search-input" placeholder="Filter........">
            </div>
            <div class="report-list">
                @for(list of module.list; track $index) {
                <div class="report-item" (click)="openedtab(module.name, list.title)">
                    {{list.title}}
                </div>
                }
            </div>
        </div>
    </div>
</div>
}
}
}
}
